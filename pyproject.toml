[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-mcp"
version = "0.2.0"
description = "Model Context Protocol server implementation for Autodesk Maya"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
maya-mcp = "maya_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["maya_mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maya_mcp*", "mayatools*"]
